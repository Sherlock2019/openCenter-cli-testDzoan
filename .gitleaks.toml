[allowlist]
description = "Allowlist for documentation examples, test fixtures, and false positives"

paths = [
  # Documentation with example/placeholder secrets
  '''docs/reference/cluster/service\.md''',
  '''docs/explanation/security-model\.md''',
  '''docs/tutorials/gitops-workflow\.md''',
  '''docs/reference/file-formats\.md''',
  '''docs/bdd-test-fix-plan\.md''',
  '''docs/cli/sops\.md''',
  # Test files with fake credentials
  '''.*_test\.go''',
  '''tests/features/.*\.feature''',
  # Local dev Gitea configuration
  '''hack/gitea-local/gitea\.app\.ini''',
  # Managed services template with placeholder token
  '''internal/gitops/templates/cluster-apps-base/managed-services/alert-proxy/account-service-token-secret\.yaml\.tpl''',
]

# Struct tag defaults are not secrets
regexes = [
  '''default=[\w-]+''',
  '''PlaceholderSecret''',
  '''hooks\.slack\.com/services/T0+/B0+/X+''',
]
